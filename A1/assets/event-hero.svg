<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Event management illustration</title>
  <desc id="desc">A dashboard style event planning illustration with schedule cards, registration notes, and presentation details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="100%" stop-color="#198754"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172033" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="8" fill="url(#bg)"/>

  <rect x="92" y="70" width="456" height="290" rx="8" fill="#ffffff" opacity="0.97" filter="url(#shadow)"/>
  <rect x="128" y="108" width="384" height="50" rx="8" fill="#eaf3ff"/>
  <text x="154" y="140" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Event Schedule</text>

  <rect x="128" y="192" width="100" height="96" rx="8" fill="#d1e7dd"/>
  <rect x="270" y="192" width="100" height="96" rx="8" fill="#cff4fc"/>
  <rect x="412" y="192" width="100" height="96" rx="8" fill="#f8d7da"/>
  <text x="152" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f5132">Plan</text>
  <text x="286" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#055160">Find</text>
  <text x="425" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#842029">Join</text>

  <rect x="652" y="70" width="430" height="290" rx="8" fill="#ffffff" opacity="0.18"/>
  <rect x="696" y="112" width="334" height="46" rx="8" fill="#ffffff" opacity="0.88"/>
  <rect x="696" y="190" width="286" height="28" rx="8" fill="#ffffff" opacity="0.62"/>
  <rect x="696" y="238" width="320" height="28" rx="8" fill="#ffffff" opacity="0.62"/>
  <rect x="696" y="286" width="220" height="28" rx="8" fill="#ffffff" opacity="0.62"/>

  <text x="696" y="144" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Registration Details</text>
  <text x="696" y="56" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Plan. Search. Register.</text>
  <text x="696" y="386" font-family="Arial, sans-serif" font-size="23" fill="#ffffff">A responsive event management web app</text>
</svg>
